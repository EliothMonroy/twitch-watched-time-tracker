name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Syntax check JavaScript
        run: |
          status=0
          for f in $(git ls-files '*.js' '*.mjs'); do
            # Skip the vendored, minified Chart.js libraries.
            case "$f" in chart.umd.js|chartjs-plugin-datalabels@2.js) continue ;; esac
            echo "node --check $f"
            node --check "$f" || status=1
          done
          exit $status

      - name: Check manifest and page scripts
        run: node scripts/check-extension.mjs

      - name: Install lint dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint
