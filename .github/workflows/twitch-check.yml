name: Twitch page check

# Checks against live twitch.tv that the page still has what the extension
# relies on. Weekly, on demand, and on PRs that touch the tracking code.
on:
  schedule:
    - cron: "23 14 * * 1" # Mondays 14:23 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/twitch-check.yml
      - e2e/**
      - playwright.config.mjs
      - content.js
      - background.js
      - manifest.json

permissions:
  contents: read

jobs:
  twitch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Check twitch.tv
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
